name: Auto-dismiss alerts

on:
  dependabot_alert:
    types: [created, reintroduced]

permissions:
  security-events: write

jobs:
  dismiss:
    uses: LouisBrunner/.github/.github/workflows/auto-dismiss-alerts.yml@main
    with:
      alert-number: ${{ github.event.alert.number }}
      package-name: ${{ github.event.alert.dependency.package.name }}
      ignore-packages: '["homeassistant"]'
      dismissed-reason: "not_used"
      dismissed-comment: "homeassistant is a dev dependency only (type stubs), not present in production"
