name: Auto-dismiss alerts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  dismiss:
    uses: LouisBrunner/.github/.github/workflows/auto-dismiss-alerts.yml@main
    with:
      ignore-packages: '["homeassistant", "aiohttp", "zeroconf", "pyjwt", "PyJWT", "pillow", "cryptography"]'
      dismissed-reason: "not_used"
      dismissed-comment: "transitive dependency of homeassistant, which is a dev dependency only (type stubs), not present in production"
