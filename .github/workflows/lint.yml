name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configs:
    uses: LouisBrunner/.github/.github/workflows/lint-configs.yml@main

  vet:
    name: Vet
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/home-assistant/homeassistant-base:2026.05.0
      options: --user root
    steps:
      - name: Install dependencies
        run: apk add --no-cache git make

      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # FIXME: for some reason the hash changes everyday for the same version
      - name: Refresh multidict hashes
        run: uv lock --upgrade-package multidict

      - name: Install dependencies
        run: make setup

      - name: Vet
        run: make vet

  manifest-sync:
    name: Manifest sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.0

      - name: Check manifest sync
        run: |
          make manifest-sync
          git diff --exit-code custom_components/proton_drive/manifest.json || (echo "manifest.json is out of sync, run 'make manifest-sync' to fix" && exit 1)
